<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>System Design Simulator</title><meta name="color-scheme" content="dark"><meta name="theme-color" content="#000">
<style>
:root{--bg:#eef1f4;--pn:#fff;--tx:#10202b;--mu:#5d6d7a;--bd:#d3dae0;--gr:#e3e8ec;--ac:#0a7ea4;--ok:#1a8f4c;--wn:#c7790a;--er:#d6342c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b141b;--pn:#13212b;--tx:#e4edf2;--mu:#8ea2b0;--bd:#26394680;--gr:#1d2f3b;--ac:#4cc3e8;--ok:#3ccf7a;--wn:#f0a030;--er:#ff5a50}}
:root[data-theme=dark]{--bg:#0b141b;--pn:#13212b;--tx:#e4edf2;--mu:#8ea2b0;--bd:#26394680;--gr:#1d2f3b;--ac:#4cc3e8;--ok:#3ccf7a;--wn:#f0a030;--er:#ff5a50}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}

#mt{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

.eb{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}.ef{fill:none;stroke-dasharray:5 11;animation:fl linear infinite;pointer-events:none}
@keyframes fl{to{stroke-dashoffset:-16}}.bl{animation:bk .7s ease-in-out infinite alternate}@keyframes bk{to{stroke-opacity:.2}}
@media(prefers-reduced-motion:reduce){.ef,.bl{animation:none}}

#gl{flex:1 1 220px}#dg{flex:2 1 300px}#sk{display:flex;gap:12px}

.mu{color:var(--mu)}.hint{color:var(--ac)}
.r{display:block;margin:10px 0}.r input,.r select{width:100%}.r b{float:right;font-variant-numeric:tabular-nums}
#st div{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding:3px 0}

@media(max-width:860px){body{height:auto}main{grid-template-columns:1fr;display:flex;flex-direction:column}#pal{display:flex;gap:6px;overflow-x:auto;border:0}#pal h4{display:none}.pi{width:auto;white-space:nowrap}svg{height:380px;flex:none}#in{border:0}#mt{margin-left:0}}
[hidden]{display:none!important}#pl .pi{font-size:12px;padding:3px 7px}#pal h4{margin:10px 0 4px}:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#000;--pn:#0a0a0a;--tx:#ededed;--mu:#8c8c8c;--bd:#262626;--gr:#1a1a1a;--ac:#3fb6e8;--ok:#34d399;--wn:#fbbf24;--er:#f87171;color-scheme:dark}#cv{overflow-x:auto}svg{min-width:1180px}#bar{position:sticky;left:0}#chs{display:none}*{scrollbar-width:thin;scrollbar-color:#333 #000}button,select{background:#111;border-color:#2a2a2a}button:hover{background:#1a1a1a}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}header{padding:10px 14px;gap:10px 14px}header h1{font-size:16px;font-weight:650}.ch{background:#0f0f0f;border:1px solid var(--bd);border-radius:8px}.ch b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pi{border-radius:8px;background:#0f0f0f;border-color:#222}.pi:hover{border-color:var(--ac)}#pal h4{position:sticky;top:-10px;background:var(--pn);padding:6px 0 4px;z-index:1;color:var(--mu);font-weight:600}svg g[data-id]>rect:first-child{filter:drop-shadow(0 3px 10px #000)}#bar{background:#050505}.cd{background:#000;border-color:#222}.cd:hover{border-color:var(--ac)}input[type=range]{height:18px}#cw{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}#cw svg{grid-area:1/1;height:100%;min-width:0}#zt{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:2}#cv.fs{position:fixed;inset:0;z-index:8;background:var(--bg)}@media(max-width:860px){#cw{height:440px;flex:none}}.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.cd{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:8px 10px;background:var(--bg)}.cd span{color:var(--mu);font-size:12px;line-height:1.35}</style></head><body>
<header><h1>⚙️ System Design Simulator</h1>
<label>Traffic <input id="rps" type="range" min="0" max="100"><b id="rv"></b></label>
<label>Writes <input id="wr" type="range" min="0" max="100"><b id="wv"></b></label>
<button id="bu">Burst ×3 (10s)</button><select id="pat"><option value="flat">Steady traffic</option><option value="wave">Daily wave</option><option value="ramp">Ramp up</option><option value="spike">Periodic spikes</option></select><button id="ps">Pause</button><button id="cz">💥 Chaos / heal</button>
<select id="chs"><option value="0">Blank canvas</option><option value="1">Challenge 1 · Flash sale surge</option><option value="2">Challenge 2 · Viral news feed</option><option value="3">Challenge 3 · Analytics pipeline</option><option value="4">Challenge 4 · Budget startup</option><option value="5">Challenge 5 · Cold cache stampede</option><option value="6">Challenge 6 · Global media launch</option><option value="7">Template · URL shortener</option><option value="8">Template · Event-driven writes</option><option value="9">Template · Media site</option></select>
<button id="rs">Reset layout</button><button id="tg">📚 Templates</button><button id="ts">🧱 Tech stack</button><button id="ex">Export</button><button id="im">Import</button><div id="mt"></div></header>
<main><aside id="pal"><input id="pq" placeholder="Search components…" style="width:100%;margin-bottom:6px;font:inherit;padding:4px 6px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px"><div id="pl"></div></aside>
<section id="cv"><div id="cw"><svg id="svg"></svg><div id="zt"><button id="zo" title="Zoom out">−</button><span id="zl" class="mu" style="min-width:42px;text-align:center;align-self:center">100%</span><button id="zi" title="Zoom in">+</button><button id="zf" title="Fit to view">Fit</button><button id="fs" title="Fullscreen">⛶</button></div></div><div id="bar"><div id="gl"></div><div id="dg"></div><div id="sk"></div></div></section>
<aside id="in"></aside></main><div id="tp" hidden style="position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9"><div style="background:var(--pn);padding:14px;border-radius:10px;width:min(920px,94vw);max-height:86vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><b id="tpt">Template library: interview designs to learn from</b><button onclick="$('#tp').hidden=true">Close</button></div><div id="tl"></div></div></div><div id="io" hidden style="position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9"><div style="background:var(--pn);padding:14px;border-radius:10px;width:min(560px,92vw)"><b id="iot"></b><textarea id="ta" style="width:100%;height:240px;margin:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px"></textarea><button id="go">Load design</button> <button onclick="$('#io').hidden=true">Close</button></div></div>
<script>
const $=s=>document.querySelector(s),W=132,H=60,svg=$('#svg');
const T={client:{n:'Traffic',i:'🌐',l:0,$:0},lb:{n:'Load Balancer',i:'⚖️',c:5e4,l:1,$:.02},app:{n:'App Servers',i:'🖥️',l:20,$:.04},cache:{n:'Redis Cache',i:'⚡',c:1e5,l:1,$:.08},queue:{n:'Kafka Queue',i:'📨',c:1e5,l:5,$:.1},db:{n:'Postgres',i:'🗄️',l:8,$:.06},nosql:{n:'NoSQL Store',i:'🧩',c:2e4,l:6,$:.1},cdn:{n:'CDN Edge',i:'🌍',c:5e5,l:5,$:.05},gw:{n:'API Gateway',i:'🚪',c:2e4,l:3,$:.04},worker:{n:'Workers',i:'🛠️',l:30,$:.04},blob:{n:'Object Store',i:'🪣',c:5e4,l:30,$:.03},search:{n:'Search Index',i:'🔎',c:1e4,l:15,$:.12},box:{n:'Custom box',i:'📦',c:1e4,l:10,$:.05}};
let S={nodes:[],edges:[],rps:5000,wr:10,sel:null,burst:0,hp:[],he:[],ch:0,m:{},t0:Date.now(),pat:'flat',pause:0},id=1,ei=1;
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':Math.round(n)+'';
const V={x:0,y:0,z:1},nd=i=>S.nodes.find(n=>n.id==i),L=(b,u)=>Math.min(5e3,u<1?b*(1+3*u*u*u):b*(4+150*(u-1)));
const eff=()=>{const t=(Date.now()-S.t0)/1e3,p=S.pat;return S.rps*(S.burst>Date.now()?3:1)*(p=='wave'?1+.6*Math.sin(t/6):p=='ramp'?1+(t%60)/20:p=='spike'?(t%20<4?4:1):1)};
function add(t,x,y,p){const n=add0(t,x,y);n.sp=Object.assign({},T[t],p||{});n.i=n.sp.i;n.name=n.sp.n;n.lat=n.sp.l;n.mode='pass';n.xr='none';return n}function add0(t,x,y){const n={id:id++,t,x,y,inst:t=='db'?0:1,hit:t=='cdn'?90:80,strat:'aside',cons:'eventual',dr:10000,buf:0,u:0,dl:0,rt:'rr',auto:0,rl:0,warm:1,down:0,lat:T[t].l,rin:0,name:T[t].n};S.nodes.push(n);return n}
/* ---------- simulation engine: propagate traffic in topological order ---------- */
function sim(dt){
 const N=S.nodes,by={},w=S.wr/100,R=eff();let done=0,tot=0;
 N.forEach(n=>{by[n.id]=n;n.q={r:0,w:0,a:0};n.o=[];n.u=0;n.rin=0;n.s=1;n.lat=n.sp.l});
 const deg={};N.forEach(n=>deg[n.id]=0);
 S.edges.forEach(e=>{e.f=0;e.fs=0;if(by[e.s]&&by[e.t]){by[e.s].o.push(e);deg[e.t]++}});
 const qu=N.filter(n=>!deg[n.id]),ord=[];
 while(qu.length){const n=qu.shift();ord.push(n);n.o.forEach(e=>{if(--deg[e.t]==0)qu.push(by[e.t])})}
 ord.forEach(n=>{
  if(n.t=='client'){n.q={r:R*(1-w),w:R*w,a:0};tot+=R}
  const q=n.q,t=n.t,sp=n.sp;let cap=1,load=q.r+q.w+q.a;n.rin=load;
  if(t=='lb'||t=='gw'){cap=sp.c*n.inst*({rr:1,lc:1.1,ip:.85}[n.rt]||1);if(n.rl>0)cap=Math.min(cap,n.rl*1e3)}
  else if(t=='app'||t=='worker')cap=n.inst*1e6/(n.dl+sp.l); // Little's law: 1000 threads per instance held for (20ms + downstream wait)
  else if(t=='cache'||t=='cdn')cap=sp.c*n.inst,load=q.r+q.w;
  else if(t=='queue')cap=sp.c*n.inst,load=q.w+q.a;
  else if(t=='nosql')cap=sp.c*n.inst*(n.cons=='strong'?.5:1);else if(sp.c)cap=sp.c*n.inst;
  let u=t=='client'?0:load/cap;
  if(t=='db'){u=q.r/((sp.rc||5e3)*(1+n.inst))+(q.w+q.a)/(sp.wc||2500);n.conn=n.rin*L(sp.l,u)/1e3;n.lag=n.xr=='async'?50+400*Math.min(2,(q.w+q.a)/(sp.wc||2500)):0;u=Math.max(u,n.conn/400)}
  if(t=='queue'&&n.full)u=Math.max(u,1.2);if(n.down)u=99;
  const s=1/Math.max(1,u);n.u=u;n.s=s;n.lat=t=='client'?0:L(sp.l,u)+(n.xr=='sync'?80:0);
  const tg=k=>{const o=n.rt=='ha'&&n.o.some(x=>!by[x.t].down)?n.o.filter(x=>!by[x.t].down):n.o,ty=x=>by[x.t].t,qs=o.filter(x=>ty(x)=='queue'),cs=o.filter(x=>ty(x)=='cache'),nq=o.filter(x=>ty(x)!='queue'),nc=o.filter(x=>ty(x)!='cache');
   return k=='r'?(cs.length?cs:nq.length?nq:o):k=='w'?(qs.length?qs:nc.length?nc:o):(nq.length?nq:o)};
  const send=(k,v)=>{if(v<=0)return;const a=tg(k);a.forEach(e=>{const x=v/a.length;e.f+=x;if(k!='a')e.fs+=x;by[e.t].q[k]+=x})};
  if(t=='client'){send('r',q.r);send('w',q.w)}
  else if(t=='cache'||t=='cdn'){n.warm=Math.min(1,n.warm+(dt?.04:0));const h=n.hit/100*n.warm*(t=='cdn'?1:1-(n.strat=='aside'?.5:.2)*w);n.hr=h;done+=q.r*h*s;send('r',q.r*(1-h)*s);
   if(n.strat=='behind'){done+=q.w*s;send('a',q.w*s)}else send('w',q.w*s)}
  else if(t=='queue'){const acc=(q.w+q.a)*s;done+=q.w*s;n.buf+=acc*dt;
   const d=n.o.length?Math.min(n.inst*n.dr,n.buf/(dt||.5)):0;n.buf-=d*dt;n.full=n.buf>5e6;if(n.full)n.buf=5e6;send('a',d)}
  else if(t=='db'||t=='nosql'||t=='blob'||t=='search'||(t=='box'&&n.mode=='sink'))done+=(q.r+q.w)*s;
  else if(n.mode!='off'){send('r',q.r*s);send('w',q.w*s);send('a',q.a*s)}
 });
 // expected synchronous latency (reverse topological order)
 const E={};let p50=0,nc=0,mu=0,cost=0;
 [...ord].reverse().forEach(n=>{const sy=n.q.r+n.q.w;let e=n.lat;
  if(sy>0)n.o.forEach(x=>{e+=Math.min(1,x.fs/(sy*n.s))*(E[x.t]||0)});
  E[n.id]=e;if(n.t=='app'||n.t=='worker')n.dl=n.dl*.5+(e-n.lat)*.5;if(n.t=='client'){p50+=e;nc++}});
 N.forEach(n=>{if(n.rin>0)mu=Math.max(mu,n.u);cost+=(n.t=='db'?1+n.inst:n.inst)*n.sp.$*730});
 p50=nc?p50/nc:0;const ok=tot?Math.min(1,done/tot):0;
 S.m={p50,p99:Math.min(5e3,p50*(1.6+1.2*Math.min(mu,3)**2)),ok,err:tot?1-ok:0,cost,mu,tot};
}
/* ---------- diagnosis ---------- */
function diag(){const m=S.m,bn=[...S.nodes].filter(n=>n.u>=1).sort((a,b)=>b.u-a.u)[0];
 if(!m.tot)return'<span class="mu">Add a Traffic node and connect it to see requests flow.</span>';
 if(m.err<=.05)return`<b style="color:var(--ok)">System healthy.</b> <span class="mu">Error rate ${(m.err*100).toFixed(1)}%. Push traffic or writes higher to find the next bottleneck.</span>`;
 if(!bn)return`<b style="color:var(--er)">${(m.err*100).toFixed(0)}% of requests never complete.</b> <span class="mu">Requests are not reaching a datastore. Connect the chain to a Postgres, NoSQL, or Queue node.</span>`;
 const p=Math.round(bn.u*100),t=bn.t,d=Math.round(bn.dl);
 let X={db:[`<b>${bn.name}</b> is at ${p}% (≈${Math.round(bn.conn||0)}/400 connections busy). App servers now wait ~${d}ms per call, so threads pile up and the failure cascades upstream.`,'Add read replicas, raise the cache hit rate, or move writes behind a queue.'],
 cache:[`<b>${bn.name}</b> is at ${p}% capacity. Requests that miss or bypass it stampede the database.`,'Add cache instances.'],
 app:[`<b>${bn.name}</b> is out of worker threads (${p}% busy; each request holds a thread for ~${d+20}ms).`,'Scale instances horizontally, or cut downstream latency with a cache.'],
 lb:[`<b>${bn.name}</b> is at ${p}% of its 50k RPS limit.`,'Add load balancer instances.'],
 queue:[`<b>${bn.name}</b> ${bn.full?'buffer is full and is dropping messages':'is at '+p+'% ingest'} (lag ${fmt(bn.buf)}).`,'Add instances, raise the consumer rate, or scale the datastore it drains into.'],
 nosql:[`<b>${bn.name}</b> is at ${p}% of write units.`,'Add partitions (instances) or switch to eventual consistency.'],cdn:[`<b>${bn.name}</b> edge is at ${p}% capacity.`,'Add CDN instances.'],gw:[`<b>${bn.name}</b> is at ${p}%${bn.rl?', shedding excess traffic with 429s':''}.`,'Raise the rate limit, add instances, or cache upstream.']}[t]||[`<b>${bn.name}</b> is at ${p}% capacity.`,'Add instances or put a cache in front.'];if(bn.down)X=[`<b>${bn.name}</b> is down.`,'Run redundant nodes behind a load balancer so one failure does not take the whole path down.'];
 return`<b style="color:var(--er)">Why it failed · ${(m.err*100).toFixed(0)}% errors.</b> ${X[0]}<br><span class="hint">${X[1]}</span>`}
/* ---------- rendering ---------- */
function draw(){
 const col=u=>u>=1?'var(--er)':u>=.7?'var(--wn)':'var(--ok)',ph=performance.now()/1e3;
 let h=`<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(${-V.x*V.z} ${-V.y*V.z}) scale(${V.z})"><circle cx="1" cy="1" r="1" fill="var(--bd)"/></pattern></defs><rect width="100%" height="100%" fill="url(#g)"/><g transform="scale(${V.z}) translate(${-V.x} ${-V.y})">`;
 S.edges.forEach(e=>{const a=nd(e.s),b=nd(e.t);if(!a||!b)return;
  const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,k=Math.max(40,Math.abs(x2-x1)/2),d=`M${x1} ${y1}C${x1+k} ${y1} ${x2-k} ${y2} ${x2} ${y2}`,f=e.f||0,du=Math.max(.3,1.6-Math.log10(f+1)*.22);
  h+=`<path data-e="${e.id}" class="eb" d="${d}"><title>Click to remove connection</title></path><path class="ef" d="${d}" stroke="${f>0?col(b.u):'var(--bd)'}" stroke-width="${(1.5+Math.min(4,Math.log10(f+1))).toFixed(1)}" style="animation-duration:${du}s;animation-delay:-${(ph%du).toFixed(2)}s;opacity:${f>0?1:.5}"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-7}" font-size="10" text-anchor="middle" fill="var(--mu)" style="fill:var(--mu)">${f>0?fmt(f):''}</text>`});
 if(S.cn){const a=nd(S.cn.f);if(a)h+=`<path d="M${a.x+W} ${a.y+H/2}L${S.cn.p[0]} ${S.cn.p[1]}" stroke="var(--ac)" stroke-dasharray="4 4" fill="none" style="pointer-events:none"/>`}
 S.nodes.forEach(n=>{const c=col(n.u),sl=n.id==S.sel,t=n.t;
  const sub=t=='client'?fmt(eff())+' req/s':t=='cache'?`hit ${Math.round((n.hr||0)*100)}% · ${fmt(n.rin)}/s`:t=='queue'?`lag ${fmt(n.buf)} · ${fmt(n.rin)}/s`:`${fmt(n.rin)}/s · ${Math.round(n.u*100)}%`;
  const nm=n.name.slice(0,17)+(t!='client'&&n.inst>(t=='db'?0:1)?(t=='db'?' +'+n.inst+'R':' ×'+n.inst):'')+(n.down?' ✖':'');
  h+=`<g data-id="${n.id}" transform="translate(${n.x},${n.y})" style="cursor:grab"><rect width="${W}" height="${H}" rx="10" fill="var(--pn)" stroke="${sl?'var(--ac)':c}" stroke-width="${sl?3:2}" stroke-dasharray="${n.mode=='off'?'5 4':'none'}" class="${n.u>=1?'bl':''}"/><text x="10" y="22" font-size="15">${n.i}</text><text x="32" y="22" font-size="11" font-weight="600">${nm}</text><text x="10" y="40" font-size="10.5" style="fill:var(--mu)">${sub}</text><rect x="10" y="48" width="${W-20}" height="4" rx="2" fill="var(--gr)"/><rect x="10" y="48" width="${Math.min(1,n.u)*(W-20)}" height="4" rx="2" fill="${c}"/><circle data-h="${n.id}" cx="${W}" cy="${H/2}" r="7" fill="var(--ac)" style="cursor:crosshair"/></g>`});

function sync(){$('#zl').textContent=Math.round(V.z*100)+'%';draw()}
function zoom(f,cx,cy){const r=svg.getBoundingClientRect();if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/2}const wx=(cx-r.left)/V.z+V.x,wy=(cy-r.top)/V.z+V.y;V.z=Math.min(2.5,Math.max(.25,V.z*f));V.x=wx-(cx-r.left)/V.z;V.y=wy-(cy-r.top)/V.z;sync()}
function fit(){const r=svg.getBoundingClientRect();if(!S.nodes.length||!r.width){V.x=0;V.y=0;V.z=1;return sync()}const a=S.nodes.map(n=>n.x),b=S.nodes.map(n=>n.y),x0=Math.min(...a),y0=Math.min(...b),w=Math.max(...a)+W-x0,h=Math.max(...b)+H-y0;V.z=Math.min(1.4,(r.width-60)/w,(r.height-60)/h);V.x=x0-(r.width/V.z-w)/2;V.y=y0-(r.height/V.z-h)/2;sync()}
$('#zi').onclick=()=>zoom(1.2);$('#zo').onclick=()=>zoom(1/1.2);$('#zf').onclick=fit;
